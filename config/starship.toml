"$schema" = 'https://starship.rs/config-schema.json'

palette = "custom"

format = """
[ ](bg:lavender fg:black)\
$username\
[](bg:blue fg:lavender)\
$directory\
[](fg:blue bg:dark_blue)\
$git_branch\
$git_status\
[](fg:dark_blue bg:darker_blue)\
$nodejs\
$rust\
$golang\
$php\
[](fg:darker_blue bg:darkest_blue)\
$time\
[ ](fg:darkest_blue)\
\n$character"""

[palettes.custom]
black       = "#090c0c"
lavender    = "#a3aed2"
blue        = "#769ff0"
dark_blue   = "#394260"
darker_blue = "#212736"
darkest_blue = "#1d2230"
white       = "#e3e5e5"
purple      = "#9A348E"
muted_blue  = "#a0a9cb"

[username]
show_always = true
style_user = "bg:lavender"
style_root = "bg:lavender"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:purple"

[directory]
style = "fg:white bg:blue"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "\u2026/"

[git_branch]
symbol = ""
style = "bg:dark_blue"
format = '[[ $symbol $branch ](fg:blue bg:dark_blue)]($style)'

[git_status]
style = "bg:dark_blue"
format = '[[($all_status$ahead_behind )](fg:blue bg:dark_blue)]($style)'

[nodejs]
symbol = ""
style = "bg:darker_blue"
format = '[[ $symbol ($version) ](fg:blue bg:darker_blue)]($style)'

[rust]
symbol = ""
style = "bg:darker_blue"
format = '[[ $symbol ($version) ](fg:blue bg:darker_blue)]($style)'

[golang]
symbol = ""
style = "bg:darker_blue"
format = '[[ $symbol ($version) ](fg:blue bg:darker_blue)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:darkest_blue"
format = '[[  $time ](fg:muted_blue bg:darkest_blue)]($style)'
