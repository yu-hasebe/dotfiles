"$schema" = 'https://starship.rs/config-schema.json'

palette = "custom"

format = """
[](bg:level1 fg:black)\
$os\
$username\
[](bg:level2 fg:level1)\
$directory\
[](bg:level3 fg:level2)\
$git_branch\
$git_metrics\
$git_status\
[](bg:level4 fg:level3)\
$golang\
$nodejs\
$terraform\
$buf\
$lua\
$rust\
[](bg:level5 fg:level4)\
$aws\
$gcloud\
[](bg:level6 fg:level5)\
$docker_context\
$container\
$kubernetes\
$netns\
$jobs\
$cmd_duration\
[](bg:level7 fg:level6)\
$time\
[](fg:level7)\
\n$character"""

[palettes.custom]
black   = "#181425"
level1  = "#FEAE34"
level2  = "#F77622"
level3  = "#D77643"
level4  = "#BE4A2F"
level5  = "#A22633"
level6  = "#733E39"
level7  = "#3E2731"
white   = "#FFFFFF"

[os]
style = "bg:level1 fg:white"
format = "[ $symbol ]($style)"
disabled = false
[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
[username]
show_always = true
style_user = "bg:level1 fg:white"
style_root = "bg:level1 fg:white"
format = '[$user ]($style)'
disabled = false

[directory]
style = "bg:level2 fg:white"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:level3"
format = '[[ $symbol $branch ](bg:level3 fg:white)]($style)'
[git_metrics]
disabled = false
added_style = "bg:level3 fg:green"
deleted_style = "bg:level3 fg:red"
format = '[[+$added]($added_style)/[-$deleted]($deleted_style) ](bg:level3 fg:white)'
[git_status]
style = "bg:level3"
format = '[[($all_status$ahead_behind )](bg:level3 fg:white)]($style)'

[golang]
symbol = ""
style = "bg:level4"
format = '[[ $symbol($version) ](bg:level4 fg:white)]($style)'
[nodejs]
symbol = ""
style = "bg:level4"
format = '[[ $symbol($version) ](bg:level4 fg:white)]($style)'
[terraform]
symbol = "󱁢"
style = "bg:level4"
format = '[[ $symbol $workspace ](bg:level4 fg:white)]($style)'
[buf]
symbol = ""
style = "bg:level4"
format = '[[ $symbol($version) ](bg:level4 fg:white)]($style)'
[lua]
symbol = ""
style = "bg:level4"
format = '[[ $symbol($version) ](bg:level4 fg:white)]($style)'
[rust]
symbol = ""
style = "bg:level4"
format = '[[ $symbol($version) ](bg:level4 fg:white)]($style)'

[aws]
symbol = "󰸏"
style = "bg:level5"
format = '[[ $symbol $profile(\($region\)) ](bg:level5 fg:white)]($style)'
[gcloud]
symbol = "󱇶"
style = "bg:level5"
format = '[[ $symbol $project ](bg:level5 fg:white)]($style)'

[docker_context]
symbol = "󰡨"
style = "bg:level6"
format = '[[ $symbol $context ](bg:level6 fg:white)]($style)'
[container]
symbol = "󱣘"
style = "bg:level6"
format = '[[ $symbol $name ](bg:level6 fg:white)]($style)'
[kubernetes]
symbol = "󱃾"
style = "bg:level6"
format = '[[ $symbol($context)(\($namespace\)) ](bg:level6 fg:white)]($style)'
[netns]
symbol = ''
style = "bg:level6"
format = '[[ $symbol $name ](bg:level6 fg:white)]($style)'
[jobs]
symbol = '󰊠'
style = "bg:level6"
format = '[[ $symbol($number) ](bg:level6 fg:white)]($style)'
[cmd_duration]
min_time = 2_000
style = "bg:level6"
format = '[[ 󱦟 $duration ](bg:level6 fg:white)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:level7"
format = '[[  $time ](bg:level7 fg:white)]($style)'

[character]
disabled = false
format = '$symbol'
success_symbol = "[󰧚 ](bold green)"
error_symbol = "[󰧚 ](bold red)"
