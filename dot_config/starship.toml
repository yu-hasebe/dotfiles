"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╔](bright-black)$fill[╗](bright-black)
[║](bright-black) $character$username$sudo$hostname$direnv$mise$directory$git_branch$git_commit$git_state$git_status$git_metrics$nodejs$rust$golang$php$python$lua$aws$gcloud$docker_context$container$netns$terraform$buf$jobs$battery$cmd_duration$time
[╚](bright-black)$fill[╝](bright-black)
[▶](bold green) """

right_format = ""

[fill]
symbol = "═"
style = "bright-black"

[character]
disabled = false
format = '$symbol'
success_symbol = "🪄"
error_symbol = "💥"

[username]
show_always = true
style_user = "bold cyan"
style_root = "bold red"
format = '[$user]($style)'

[sudo]
disabled = false
symbol = "👑sudo"
style = "bold yellow"
format = ' [│](bright-black) [$symbol]($style)'

[hostname]
ssh_only = true
ssh_symbol = "🏰"
style = "bold cyan"
format = ' [│](bright-black) [$ssh_symbol$hostname]($style)'

[direnv]
disabled = false
symbol = "🌐"
style = "bold orange"
format = ' [│](bright-black) [$symbol$allowed]($style)'

[mise]
disabled = false
symbol = "🐭"
style = "bold green"
format = ' [│](bright-black) [$symbol$version]($style)'

[directory]
style = "bold cyan"
format = ' [│](bright-black) [🌃$path]($style)'
truncation_length = 2
truncation_symbol = "…/"

[git_branch]
symbol = "🔭"
style = "bold purple"
format = ' [│](bright-black) [$symbol$branch]($style)'

[git_commit]
style = "bold purple"
format = ' [│](bright-black) [🌟$hash$tag]($style)'

[git_state]
style = "bold purple"
format = ' [│](bright-black) [🌌$state( \($progress_current/$progress_total\))]($style)'

[git_status]
style = "bold red"
format = '[$all_status$ahead_behind]($style)'
conflicted = "✖"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_metrics]
disabled = false
added_style = "bold green"
deleted_style = "bold red"
format = ' [+$added]($added_style)[-$deleted]($deleted_style)'

[nodejs]
symbol = " "
style = "bold green"
format = ' [│](bright-black) [$symbol($version)]($style)'

[rust]
symbol = " "
style = "bold red"
format = ' [│](bright-black) [$symbol($version)]($style)'

[golang]
symbol = " "
style = "bold cyan"
format = ' [│](bright-black) [$symbol($version)]($style)'

[php]
symbol = " "
style = "bold purple"
format = ' [│](bright-black) [$symbol($version)]($style)'

[python]
symbol = " "
style = "bold yellow"
format = ' [│](bright-black) [$symbol($version)]($style)'

[lua]
symbol = " "
style = "bold blue"
format = ' [│](bright-black) [$symbol($version)]($style)'

[aws]
symbol = "󰸏"
style = "bold yellow"
format = ' [│](bright-black) [$symbol $profile(\($region\))]($style)'

[gcloud]
symbol = "󱇶"
style = "bold blue"
format = ' [│](bright-black) [$symbol $project]($style)'

[docker_context]
symbol = "󰡨"
style = "bold blue"
format = ' [│](bright-black) [$symbol $context]($style)'

[container]
symbol = "📦"
style = "bold yellow"
format = ' [│](bright-black) [$symbol$name]($style)'

[netns]
disabled = false
format = ' [│](bright-black) [🌉$name]($style)'
style = "bold blue"

[terraform]
symbol = "󱁢"
style = "bold purple"
format = ' [│](bright-black) [$symbol $workspace]($style)'

[buf]
symbol = "💪"
style = "bold blue"
format = ' [│](bright-black) [$symbol($version)]($style)'

[jobs]
symbol = "👻"
style = "bold white"
format = ' [│](bright-black) [$symbol$number]($style)'

[battery]
discharging_symbol = "🪫"
format = ' [│](bright-black) [$symbol$percentage]($style)'

[[battery.display]]
threshold = 30
style = "bold yellow"

[[battery.display]]
threshold = 10
style = "bold red"

[cmd_duration]
min_time = 2_000
style = "bold yellow"
format = ' [│](bright-black) [⌛$duration]($style)'

[time]
disabled = false
time_format = "%R"
style = "bold white"
format = ' [│](bright-black) [🔔$time]($style)'
